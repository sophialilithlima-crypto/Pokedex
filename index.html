<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="pokedex">

        <!-- LADO ESQUERDO -->

        <section class="left-panel">

            <div class="top-section">

                <div class="main-led"></div>

                <div class="mini-led red"></div>
                <div class="mini-led yellow"></div>
                <div class="mini-led green"></div>

            </div>

            <div class="screen-frame">

                <div class="screen-top">

                    <span class="screen-light"></span>
                    <span class="screen-light"></span>

                </div>

                <div class="screen">

                    <input
                        type="text"
                        id="search"
                        placeholder="Buscar Pokémon..."
                    >

                    <select id="typeFilter">
                        <option value="">Todos os tipos</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="grass">Planta</option>
                        <option value="electric">Elétrico</option>
                        <option value="ice">Gelo</option>
                        <option value="fighting">Lutador</option>
                        <option value="poison">Veneno</option>
                        <option value="ground">Terra</option>
                        <option value="flying">Voador</option>
                        <option value="psychic">Psíquico</option>
                        <option value="bug">Inseto</option>
                        <option value="rock">Pedra</option>
                        <option value="ghost">Fantasma</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="steel">Aço</option>
                        <option value="fairy">Fada</option>
                        <option value="normal">Normal</option>
                    </select>

                    <div id="pokedexList"></div>

                </div>

            </div>

            <div class="left-controls">

                <button id="loadMore">
                    Carregar Mais
                </button>

            </div>

        </section>

        <!-- DOBRADIÇA -->

        <div class="hinge"></div>

        <!-- LADO DIREITO -->

        <section class="right-panel">

            <div class="pokemon-display">

                <div id="pokemonInfo">

                    <div class="empty-state">

                        <i class="fa-solid fa-gamepad"></i>

                        <h2>Pokédex</h2>

                        <p>Selecione um Pokémon</p>

                    </div>

                </div>

            </div>

            <div class="control-row">

                <button id="favoritesBtn">
                    <i class="fa-solid fa-star"></i>
                    Favoritos (<span id="favoritesCount">0</span>)
                </button>

                <button id="backFavorites">
                    Voltar
                </button>

            </div>

            <div class="stats-screen">

                <div id="pokemonCounter">
                    0 / 0
                </div>

                <div id="evolutionArea"></div>

            </div>

        </section>

    </div>

    <!-- BOTÕES FIXOS -->

    <button id="backToTop">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <button id="scrollDown">
        <i class="fa-solid fa-arrow-down"></i>
    </button>

    <script src="script.js"></script>

</body>
</html>
